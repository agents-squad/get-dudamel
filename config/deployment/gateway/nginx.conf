# The gateway is the ONLY host-exposed port (:8080). Everything a browser or a
# provider's webhook sees passes through here, so this is where the response
# security headers and the per-client rate limits live — one place, every route.
#
# nginx gotcha that shapes this file: `add_header` is inherited from `server` into
# a `location` ONLY when that location declares no `add_header` of its own. Every
# header below therefore lives at server level and varies per route through `map`,
# and NO location block adds headers — adding one silently drops all of these.

# The operator's TLS terminator (reverse proxy, tunnel) sits in front and reports
# the original scheme in X-Forwarded-Proto. HSTS only makes sense on https; an
# empty value makes nginx omit the header on plain-http installs.
map $http_x_forwarded_proto $hsts_value {
    https   "max-age=31536000; includeSubDomains";
    default "";
}

# Content-Security-Policy per surface. The SPA needs scripts/styles/fonts from
# itself (Monaco is bundled, not loaded from a CDN), blob: workers for Monaco,
# data:/blob: images for avatars and previews, and same-origin XHR/SSE. API and
# webhook responses are JSON: nothing may load from them.
map $uri $csp_value {
    # ONLY paths that have their own `location` proxying to a backend below. `/integrations`
    # and every other path fall through to the SPA and must get the SPA policy — listing an
    # SPA route here leaves that page blank on reload (its own JS/CSS blocked).
    ~^/(api|oauth|public|webhooks)(/|$)  "default-src 'none'; frame-ancestors 'none'";
    ~^/marketplace\.git                                        "default-src 'none'; frame-ancestors 'none'";
    default "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; child-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'";
}

# Real client IP for rate limiting and for the X-Real-IP the services log. The
# gateway only ever sees the operator's proxy directly, which is why the trusted
# ranges are the private ones: an X-Forwarded-For from anywhere else is ignored.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from 127.0.0.1;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Per-client budgets. `/oauth/` is the login surface (the API also throttles failed
# attempts per identity); `/webhooks/` is unauthenticated by design and only has the
# instance UUID as a secret for some integrations, so a burst from one address is
# capped. Bursts absorb legitimate spikes (a provider redelivering a batch).
limit_req_zone $binary_remote_addr zone=gw_oauth:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=gw_webhooks:10m rate=30r/s;
limit_req_status 429;

server {
    listen 80;
    server_tokens off;

    resolver 127.0.0.11 valid=10s;

    client_max_body_size 20m;

    # ── Security headers (see the note at the top: server level only) ──────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Content-Security-Policy $csp_value always;
    add_header Strict-Transport-Security $hsts_value always;

    # OAuth routes → orchestrator
    location /oauth/ {
        limit_req zone=gw_oauth burst=20 nodelay;
        set $upstream_orchestrator http://orchestrator:3000;
        proxy_pass $upstream_orchestrator;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Chat API → orchestrator (extended timeout for agent responses). Must exceed the
    # conversation turn's activity timeout (12 min, CONVERSATION_TURN_ACTIVITY_TIMEOUT_MS),
    # or nginx answers 504 while the turn is still running.
    location /api/chat/ {
        set $upstream_orchestrator http://orchestrator:3000;
        proxy_pass $upstream_orchestrator;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 900s;
    }

    # Execution log streaming (SSE) → orchestrator
    location ~ ^/api/executions/[^/]+/stream$ {
        set $upstream_orchestrator http://orchestrator:3000;
        proxy_pass $upstream_orchestrator;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_set_header Connection '';
        chunked_transfer_encoding off;
    }

    # System update SSE (progress stream) → orchestrator (validates JWT + admin,
    # then proxies to the updater with the internal token). Kept here as its own
    # location so SSE-specific buffering/timeout settings apply.
    location ~ ^/api/system/updates/[^/]+/progress$ {
        set $upstream_orchestrator http://orchestrator:3000;
        proxy_pass $upstream_orchestrator;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        chunked_transfer_encoding off;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
    }

    # System update API → orchestrator (validates JWT + admin role, then proxies to updater)
    location /api/system/ {
        set $upstream_orchestrator http://orchestrator:3000;
        proxy_pass $upstream_orchestrator;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    # Public routes (no auth) → orchestrator
    location /public/ {
        set $upstream_orchestrator http://orchestrator:3000;
        proxy_pass $upstream_orchestrator;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API routes → orchestrator
    location /api/ {
        set $upstream_orchestrator http://orchestrator:3000;
        proxy_pass $upstream_orchestrator;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Integration webhook routes → ingress service
    location /webhooks/ {
        limit_req zone=gw_webhooks burst=60 nodelay;
        set $upstream_ingress http://ingress:3003;
        proxy_pass $upstream_ingress;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Marketplace Git repo → orchestrator
    location /marketplace.git {
        set $upstream_orchestrator http://orchestrator:3000;
        proxy_pass $upstream_orchestrator;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    # Everything else → dashboard SPA
    location / {
        set $upstream_dashboard http://dashboard:80;
        proxy_pass $upstream_dashboard;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
